[package]
name = "shear_core"
version = "0.1.0"
edition = "2024"

[features]
default = ["metrics"]
metrics = []
ffi = []
pipnn_cuda = ["dep:cudarc"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = "1.3.3" 
byteorder = "1.4.3"
bytemuck = { version = "1.15.0", features = ["derive"] }
cblas = "0.5.0"
crossbeam = "0.8.2"
half = "2.2.1"
hashbrown = "0.15"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
num-traits = "0.2.15"
once_cell = "1.17.1"
rand = { version = "0.9", features = [ "small_rng" ] }
rayon = "1.11.0"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3.36", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
memmap2 = "0.5"
monoio = { workspace = true }
indicatif = "0.17.8"
dashmap = { version = "6.1", features = ["rayon"] }
futures-util = { version = "0.3", default-features = false }
local-sync = { path = "../local-sync" }
ndarray = { version = "0.14.0", features = ["blas"] }
ndarray-linalg = { version = "0.13", features  = ["openblas-system"] }
io-uring = { workspace = true }
crossbeam-queue = "0.3.12"
parking_lot = "0.12"
cudarc = { version = "0.19.3", optional = true, default-features = false, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-12080"] }
tempfile = "3.20"

[build-dependencies]
cc = "1.0.79"

[dev-dependencies]
approx = "0.5.1"
